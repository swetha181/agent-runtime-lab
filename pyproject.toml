[project]
name = "agent-runtime-lab"
version = "0.1.0"
description = "Tool-calling Claude agent runtime for engineering workflows: routing, RAG, MCP tools, guardrails, tracing and a replayable eval harness."
requires-python = ">=3.11"
dependencies = [
    "anthropic[mcp]>=1.15",
    "fastapi>=0.140",
    "uvicorn>=0.50",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["agent_lab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
