name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Offline evaluation (no API key needed)
        run: python -m evals.run --mode offline
      - name: Replay recorded agent runs (regression check)
        if: hashFiles('evals/cassettes/*.json') != ''
        run: python -m evals.run --mode replay
